<h2 mat-dialog-title>Cadastrar Novo Ambiente</h2>

<form [formGroup]="form" (ngSubmit)="salvar()">
  <mat-dialog-content class="mat-typography">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Nome do Ambiente</mat-label>
      <input matInput formControlName="nome" placeholder="Ex: Laboratório 03, Sala 12..." />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mt-2">
      <mat-label>Ícone Representativo</mat-label>
      <mat-select formControlName="icone">
        <mat-select-trigger>
          <div class="d-flex align-items-center gap-2">
            <mat-icon>{{ form.get('icone')?.value }}</mat-icon>
            <span>
              {{ listaIcones.find((i) => i.classe === form.get('icone')?.value)?.label }}
            </span>
          </div>
        </mat-select-trigger>

        <mat-option *ngFor="let icone of listaIcones" [value]="icone.classe">
          <div class="d-flex align-items-center gap-2">
            <mat-icon>{{ icone.classe }}</mat-icon>
            <span>{{ icone.label }}</span>
          </div>
        </mat-option>
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
      Salvar
    </button>
  </mat-dialog-actions>
</form>
